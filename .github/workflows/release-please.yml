name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update package.json and action.yml version
        if: steps.release.outputs.release_created
        run: |
          VERSION_TAG="${{ steps.release.outputs.tag_name }}"
          # Update package.json version
          sed -i "s/version\": \"[0-9.]*\"/version\": \"$VERSION_TAG\"/" package.json
          # Update action.yml version
          sed -i "s/^\(\s*uses:\s*vln-devsecops\/actions-generate-licenses@\).*/${VERSION_TAG}/" action.yml
          git config user.name "OpenClaw"
          git config user.email "openclaw@example.com"
          git add package.json action.yml
          git commit -m "CI: Update versions according to release-please"
          git push origin add-release-please
          gh pr create --base main --head add-release-please --title "CI: Add release-please automation" --body "This PR adds release-please configuration to automate versioning and releases for package.json and action.yml." --repo vln-devsecops/actions-generate-licenses
