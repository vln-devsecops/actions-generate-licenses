name: Validate Action

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches:
      - main
      - 'release/v*'

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate --omit=dev

      - name: Audit all dependencies for critical issues
        run: npm audit --audit-level=critical

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate action.yml
        run: |
          if [ ! -f action.yml ]; then
            echo "Error: action.yml not found"
            exit 1
          fi

          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
          echo "✓ action.yml is valid YAML"

          if ! grep -q "name:" action.yml; then
            echo "Error: action.yml missing 'name' field"
            exit 1
          fi

          if ! grep -q "description:" action.yml; then
            echo "Error: action.yml missing 'description' field"
            exit 1
          fi

          echo "✓ action.yml has required fields"

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify dist is up to date
        id: dist_check
        run: |
          npm run build
          git add dist/
          if git diff --cached --quiet -- dist/; then
            echo "stale=false" >> "${GITHUB_OUTPUT}"
          else
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "::warning::dist/ is stale and was rebuilt. Committing update."
            git diff --cached --stat -- dist/
          fi

      - name: Commit updated dist
        if: steps.dist_check.outputs.stale == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: rebuild dist"
          git push

      - name: Fail if dist is stale on pull request
        if: steps.dist_check.outputs.stale == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::dist/ is stale. Run 'npm run build' locally with Node.js $(node --version) and commit the result before merging."
          exit 1
