version: 2
updates:
  # Enable version updates for npm on main branch
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
  # Enable version updates for npm on dev branch (if it exists)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
  # Enable version updates for GitHub Actions on main branch
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10
  # Enable version updates for GitHub Actions on dev branch (if it exists)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10